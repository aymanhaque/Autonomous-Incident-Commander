server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the execution service
    location /api/ {
        proxy_pass http://execution:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy approval API calls to the in-cluster approval-api service.
    # The approval-api gates its write endpoints (POST /approvals, /decide,
    # /resume) with a shared service token. We inject that token HERE, server
    # side, so the browser never holds the secret. ${APPROVAL_API_TOKEN} is
    # substituted at container start by the nginx image's envsubst step
    # (see Dockerfile: this file is shipped as a *.template and
    # NGINX_ENVSUBST_FILTER limits substitution to APPROVAL_API_TOKEN so the
    # $host / $remote_addr / $proxy_add_x_forwarded_for runtime vars below are
    # left untouched). proxy_set_header overrides any client-sent header, so a
    # browser can never spoof or leak the token.
    location /approvals/ {
        proxy_pass http://approval-api:8080/approvals/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer ${APPROVAL_API_TOKEN}";
    }

    # Proxy agent calls (LangGraph / SSE streaming)
    location /agent/ {
        proxy_pass http://agent:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
