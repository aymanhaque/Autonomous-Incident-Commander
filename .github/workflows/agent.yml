name: agent-ci

on:
  push:
    branches: [ "main", "k8sDeployment" ]
    paths:
      - "agent/**"
  pull_request:
    branches: [ "main", "k8sDeployment" ]
    paths:
      - "agent/**"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update image tag in values.yaml
        if: github.event_name == 'push'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          yq -i ".images.agent.tag = \"sha-${SHORT_SHA}\"" deployment/helm/aic-chart/values.yaml

      - name: Commit updated values.yaml
        if: github.event_name == 'push'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/helm/aic-chart/values.yaml
          git diff --staged --quiet || git commit -m "ci: update agent image tag to sha-${SHORT_SHA} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done
