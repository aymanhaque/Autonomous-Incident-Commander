apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aic-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AlexGandarilla/Autonomous-Incident-Commander-Project
    targetRevision: main
    path: deployment/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
