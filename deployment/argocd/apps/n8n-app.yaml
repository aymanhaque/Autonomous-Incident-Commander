apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aic-n8n
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AlexGandarilla/Autonomous-Incident-Commander-Project
    targetRevision: main
    path: deployment/n8n
  destination:
    server: https://kubernetes.default.svc
    namespace: aic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
