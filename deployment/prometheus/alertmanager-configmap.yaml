apiVersion: v1
kind: ConfigMap
metadata:
  name: aic-alertmanager-config
  namespace: aic-monitoring
  labels:
    app.kubernetes.io/part-of: aic
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'pod', 'node']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      receiver: n8n-webhook

    receivers:
      - name: n8n-webhook
        webhook_configs:
          - url: "http://n8n.aic.svc.cluster.local:5678/webhook/aic"
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname', 'node', 'pod']
