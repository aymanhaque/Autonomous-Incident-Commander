apiVersion: v1
kind: ConfigMap
metadata:
  name: aic-prometheus-config
  namespace: aic-monitoring
  labels:
    app.kubernetes.io/part-of: aic
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.aic-monitoring.svc.cluster.local:9093"]

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: aic-execution
        static_configs:
          - targets: ["execution.aic.svc.cluster.local:8000"]
        metrics_path: /metrics

      # kube-state-metrics must be deployed in the cluster (standard kube-system install).
      # Provides metrics for OOMKilled and node pressure alert rules.
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]
